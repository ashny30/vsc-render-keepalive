
name: Keep Render Production Awake

on:
  schedule:
    # 8:00 AM, 8:10 AM and 8:20 AM IST
    - cron: "30,40,50 2 * * *"

    # 8:30 AM to 7:20 PM IST
    - cron: "*/10 3-13 * * *"

    # 7:30 PM, 7:40 PM and 7:50 PM IST
    - cron: "0,10,20 14 * * *"

  workflow_dispatch:

jobs:
  keep-render-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Render Backend
        run: |
          echo "Pinging VIJAYA SPORTS CLUB Production..."
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" --max-time 120 https://vscsaligrama-api.onrender.com
